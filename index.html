<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>명품 경북여상 문해력 15분</title>
<meta name="description" content="특성화고 학생을 위한 하루 15분 문해력 학습">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="mobileOverlay" class="overlay" hidden></div>

<div class="app-shell">

  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="메뉴 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="brand-emoji">📖</span>
      <span class="brand-text">명품 경북여상 문해력 15분</span>
    </div>
    <div class="topbar-progress">
      <div class="progress-track"><div id="globalProgressBar" class="progress-fill"></div></div>
      <span id="globalProgressLabel" class="progress-label">0 / 80일</span>
    </div>
    <div class="topbar-actions">
      <button id="winnersBtn" class="icon-btn winners-btn" aria-label="이번 주 행운의 7명" title="이번 주 행운의 7명">🎉</button>
      <div class="streak-chip" id="streakChip" title="연속 학습일">
        <span class="streak-flame">🔥</span><span id="streakCount">0</span>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="화면 모드 전환">
        <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span>전체 학습 지도</span>
      <button id="closeSidebarBtn" class="icon-btn mobile-only" aria-label="닫기">✕</button>
    </div>
    <nav id="sidebarNav" class="sidebar-nav"></nav>
  </aside>

  <main id="content" class="content"></main>

</div>

<script src="js/config.js"></script>
<script src="data/curriculum.js"></script>
<script src="data/content/w01.js"></script>
<script src="data/content/w02.js"></script>
<script src="data/content/w03.js"></script>
<script src="data/content/w04.js"></script>
<script src="data/content/w05.js"></script>
<script src="data/content/w06.js"></script>
<script src="data/content/w07.js"></script>
<script src="data/content/w08.js"></script>
<script src="data/content/w09.js"></script>
<script src="data/content/w10.js"></script>
<script src="data/content/w11.js"></script>
<script src="data/content/w12.js"></script>
<script src="data/content/w13.js"></script>
<script src="data/content/w14.js"></script>
<script src="data/content/w15.js"></script>
<script src="data/content/w16.js"></script>
<script src="js/splash.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/scoreboard.js"></script>
<script src="js/winners.js"></script>
<script src="js/app.js"></script>
</body>
</html>
